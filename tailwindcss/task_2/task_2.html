<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailwindCss</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-50 min-h-screen p-4">
    <form class="bg-white rounded-lg shadow-sm p-8 mx-auto mt-20 w-96">
      <!-- email and phone -->
      <div class="mb-4">
        <input
          type="email"
          placeholder="Email address"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-36 h-10 px-3 py-2 mr-2"
        />
        <input
          type="tel"
          placeholder="Phone number"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-36 h-10 px-3 py-2"
        />
      </div>

      <!-- first name & last name -->
      <div class="mb-4">
        <input
          type="text"
          placeholder="First name"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-36 h-10 px-3 py-2 mr-2"
        />
        <input
          type="text"
          placeholder="Last name"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-36 h-10 px-3 py-2"
        />
      </div>

      <!-- street address & Country -->
      <div class="mb-4">
        <input
          type="text"
          placeholder="Street address"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-36 h-10 px-3 py-2 mr-2"
        />
        <select
          class="inline-block border border-gray-300 rounded-md text-sm text-gray-400 w-36 h-10 px-3 py-2"
        >
          <option>Country</option>
        </select>
      </div>

      <!-- apartment link -->
      <div class="mb-4">
        <button type="button" class="text-sm text-blue-600">
          + Apartment, Building, Floor
        </button>
      </div>

      <!-- zip, city, and state -->
      <div class="mb-4">
        <input
          type="text"
          placeholder="Zip"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-20 h-10 px-3 py-2 mr-2"
        />
        <input
          type="text"
          placeholder="City"
          class="inline-block border border-gray-300 rounded-md text-sm placeholder-gray-400 w-24 h-10 px-3 py-2 mr-2"
        />
        <select
          class="inline-block border border-gray-300 rounded-md text-sm text-gray-400 w-20 h-10 px-3 py-2"
        >
          <option>State</option>
        </select>
      </div>

      <!-- continue button -->
      <div class="mt-6">
        <button
          type="submit"
          class="bg-gray-900 text-white rounded-full text-sm font-medium hover:bg-gray-800 w-80 h-12 py-3"
        >
          Continue
        </button>
      </div>
    </form>
  </body>
</html>
